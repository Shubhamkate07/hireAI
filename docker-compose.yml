services:
  mysql:
    image: mysql:8.0
    container_name: hireai-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hireai_db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - backend
      

  redis:
    image: redis:7-alpine
    container_name: hireai-redis

    ports:
      - "6379:6379"
    networks:
      - backend

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.multistage

    container_name: hireai-server

    ports:
      - "5000:5000"

    env_file:
      - ./server/.env

    environment:
      DB_HOST: mysql
      REDIS_HOST: redis

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - backend
      - frontend

  client:
    build:
      context: ./client/hireai_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api

    container_name: hireai-client

    ports:
      - "3000:80"

    depends_on:
      server:
        condition: service_started
    networks:
      - frontend
      
volumes:
  mysql_data:

networks:
  backend:
  frontend:
